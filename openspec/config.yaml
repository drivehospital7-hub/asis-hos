# openspec/config.yaml — SDD Configuration for asis-hos (control_system_unificado)
# Auto-generated by sdd-init on 2026-06-30 (refreshed)
schema: spec-driven

context: |
  Project: asis-hos — Medical Billing Control System for EPS MALLAMAS (indigenous healthcare provider).
  Python 3.14.0 | Flask 3.1.3 | Polars 1.39 (Excel reading) | openpyxl 3.1 (Excel writing) | waitress 3.0 (prod)
  SQLAlchemy + PostgreSQL (localhost:5433, asis_hos) + psycopg3.
  Architecture: Flask routes → services (5 domains + engine + transversales) → utils.
    Routes are thin delegators; services follow SRP (one detector per file); each domain has detect_all.py.
    Engine: RuleEvaluationEngine (DB-backed rule engine) + RuleBasedDetector (legacy wrapper).
    Engine components: ConditionEvaluator, EvidenceCollector, ExceptionHandler, GroupEvaluator, RuleResolver, ContextProviders.
  Frontend: Flask templates + React (Vite + Tailwind CSS + shadcn/ui + Lucide) at frontend/.
  Testing: pytest 9.0.3, 46+ test files, Flask test client, pytest-cov 7.1.0 + coverage 7.14.0.
  Conventions: AGENTS.md (code rules) + CONVENTIONS.md (business rules).
  SDD state: openspec/changes/ with 35 change directories (active + archived).
  Response envelope: {"status": "success"|"error", "data": {...}, "errors": [...]}

testing:
  strict_tdd: true
  test_runner:
    command: pytest
    framework: pytest 9.0.3
    method: python -m pytest (no venv detected; run via installed packages)
    options: -v (default addopts)
  test_layers:
    unit: true
    integration: true
    e2e: false
  coverage:
    available: true
    tool: pytest-cov 7.1.0 + coverage 7.14.0
    command: python -m pytest --cov
    report_file: .coverage
  quality_tools:
    linter: none
    type_checker: none
    formatter: none

rules:
  proposal:
    - Include intent, scope, and approach for each change.
  specs:
    - Use Given/When/Then for scenarios.
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
  design:
    - Include sequence diagrams for complex flows.
    - Document architecture decisions with rationale.
  tasks:
    - Group by phase, use hierarchical numbering.
    - Keep tasks completable in one session.
  apply:
    - Follow existing code patterns (AGENTS.md).
    - Run pytest before committing on any change.
    tdd: true
    test_command: python -m pytest -v
  verify:
    test_command: python -m pytest -v
    build_command: python run_dev.py
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas.
